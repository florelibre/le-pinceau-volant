schema: spec-driven

context: |
  Site vitrine pour l'artiste peintre Flore.

  Stack: Hugo (pas de thème, layouts custom dans layouts/).
  CSS brut dans static/css/main.css (pas de pipeline d'assets).
  Déploiement: GitHub Actions -> GitHub Pages, automatique
  sur push vers main.

  Contenu: Markdown + YAML frontmatter dans content/
  (accueil, a-propos, services/tarifs, contact, actualités).

  CMS: Sveltia, admin sur /admin/, config dans
  static/admin/config.yml. Backend GitHub, authentification
  par jeton (PAT), pas d'OAuth/proxy Netlify.

  Les changements peuvent porter sur le code/layout Hugo
  ou sur le contenu/la config du CMS.

